<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inner scroller</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 16px/1.5 sans-serif; }
    #scroller { height: 100%; overflow: auto; }
    #content { width: 600px; margin: 0 auto; padding: 300px 0 2000px; }
  </style>
</head>
<body>
  <div id="scroller">
    <div id="content">
      <p id="p1">Paragraph inside a scrolling container.</p>
    </div>
  </div>
</body>
</html>
