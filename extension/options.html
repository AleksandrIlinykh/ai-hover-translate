<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paragloss settings</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
    body { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 18px 0 4px; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; padding: 6px 8px; font: inherit; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; min-width: 0; }
    .hint { margin: 4px 0 0; font-size: 13px; opacity: 0.7; }
    button { padding: 6px 16px; font: inherit; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-top: 24px; }
    #status { flex-basis: 100%; overflow-wrap: anywhere; }
    .footer { margin-top: 32px; }
    #status.error { color: #c62828; }
    @media (prefers-color-scheme: dark) { #status.error { color: #ef9a9a; } }
  </style>
</head>
<body>
  <h1>Paragloss</h1>
  <p>Hold Alt and hover over a paragraph to see its translation above it.</p>
  <form id="form">
    <label for="targetLang">Translate into</label>
    <select id="targetLang" name="targetLang"></select>

    <label for="provider">Translate with</label>
    <select id="provider" name="provider"></select>
    <p class="hint" id="providerHint" hidden></p>
    <p class="hint" id="dataNote"></p>

    <div id="apiFields">
    <label for="apiKey">API key</label>
    <div class="row">
      <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false">
      <button type="button" id="showKey">Show</button>
    </div>
    <p class="hint" id="keyHint">Get a key: <a id="keyLink" target="_blank" rel="noreferrer"></a></p>

    <label for="model">Model</label>
    <div class="row">
      <input id="model" name="model" list="modelList" autocomplete="off" spellcheck="false">
      <button type="button" id="loadModels">Load models</button>
    </div>
    <datalist id="modelList"></datalist>
    <p class="hint" id="modelHint" role="status"></p>

    <label for="baseUrl">API URL</label>
    <input id="baseUrl" name="baseUrl" spellcheck="false">
    <p class="hint">The address up to /v1. Clear it to go back to the provider's own.</p>
    </div>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" id="test">Test</button>
      <span id="status" role="status"></span>
    </div>
  </form>
  <p class="hint footer">
    <a href="https://github.com/AleksandrIlinykh/paragloss/blob/main/PRIVACY.md" target="_blank" rel="noreferrer">Privacy policy</a>
  </p>
  <script src="content/translator.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
